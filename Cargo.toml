[workspace]
resolver = "2"
members = [
    "protocol",
    "macros",
    "injector",
    "client",
    "agent_loader",
    "xtask",
    "mapping_derive",
]

[workspace.package]
version = "1.0.0"
edition = "2021"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
debug = false
incremental = false

 
 
 
 
 
 
[profile.devtest]
inherits = "release"
lto = false
codegen-units = 16
debug = "limited"
strip = false

 
 
 
 
[patch.crates-io]
ilhook = { path = "vendor/ilhook" }

[workspace.dependencies]
egui = "0.29.0"
eframe = { version = "0.29", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4.25"
simplelog = "0.12.2"
anyhow = "1.0"
thiserror = "2.0"
libc = "0.2"
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
dashmap = "6.1"
sysinfo = "0.37.2"
crossterm = "0.29"
ctor = "0.2.8"
syn = "2"
quote = "1"
ristretto_classfile = "0.33.0"
