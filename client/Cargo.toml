[package]
name = "client"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[features]
 
 
 
 
devtest = []

[dependencies]
egui.workspace = true
log.workspace = true
simplelog.workspace = true
jni.workspace = true
serde.workspace = true
anyhow.workspace = true
thiserror.workspace = true
dashmap.workspace = true
egui_glow = "0.29.0"
glow = "0.14.0"
serde_json = "1.0.135"
libloading = "0.9.0"
 
 
image = { workspace = true, features = ["jpeg", "gif", "webp"] }
 
 
ilhook = { version = "2.3.0", default-features = false, features = ["x64"] }
lazy_static = "1.4.0"
mapping_derive = { path = "../mapping_derive" }
infered_macros = { path = "../macros" }
ristretto_classfile.workspace = true
rhai = { version = "1.26.1", features = ["serde"] }

[dev-dependencies]
 
 
jni = { workspace = true, features = ["invocation"] }

[build-dependencies]
gl_generator = "0.14"
cc = "1"

[target.'cfg(target_os = "linux")'.build-dependencies]
java-locator = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

 
 
 
 
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Web_Http",
     
    "Win32_Media_MediaFoundation",
     
    "Win32_UI_Controls_Dialogs",
    "Win32_System_Com",
    "Win32_System_WinRT",
] }
